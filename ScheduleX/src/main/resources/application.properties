# Database Configuration (override with environment variables; never commit real credentials)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/schedulex_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Server Configuration
server.port=${PORT:8080}

# Thread Pool Configuration
schedulex.worker.threads=10

# Scheduler Configuration
schedulex.scheduler.poll-interval=5000

# Simulated payment gateway latency
schedulex.gateway.simulated-latency-ms=2000

# Logging
logging.level.com.schedulex=INFO
logging.level.org.springframework.web=INFO

# Serve static files
spring.web.resources.static-locations=classpath:/static/
