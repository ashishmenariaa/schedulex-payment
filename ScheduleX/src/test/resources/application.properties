# Tests run against in-memory H2 in MySQL mode, so CI needs no database server
spring.datasource.url=jdbc:h2:mem:schedulex;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

schedulex.worker.threads=2
# Effectively disable background polling; tests drive the scheduler explicitly
schedulex.scheduler.poll-interval=3600000
schedulex.gateway.simulated-latency-ms=0
